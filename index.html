<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учим иероглифы HSK</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #d32f2f; }
        #character-target {
            margin: 20px auto;
            width: 300px;
            height: 300px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #info {
            margin-top: 20px;
            font-size: 18px;
        }
        #char-list {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .char-btn {
            padding: 15px;
            font-size: 24px;
            min-width: 60px;
        }
    </style>
</head>
<body>
    <h1>🀄 Учим иероглифы HSK</h1>
    <div id="character-target"></div>
    <div id="info">
        <p><b>Иероглиф:</b> <span id="char">-</span></p>
        <p><b>Пиньинь:</b> <span id="pinyin">-</span></p>
        <p><b>Перевод:</b> <span id="meaning">-</span></p>
    </div>
    <button onclick="animateCharacter()">▶ Показать анимацию</button>
    <button onclick="quizCharacter()">️ Проверить меня</button>
    <button onclick="nextCharacter()">➡️ Следующий</button>
    
    <div id="char-list"></div>

    <script>
        let writer;
        let characters = [];
        let currentIndex = 0;

        // Загружаем данные из JSON файла
        fetch('hsk-data.json')
            .then(response => response.json())
            .then(data => {
                characters = data;
                displayCharacterList();
                loadCharacter(0);
            })
            .catch(error => {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('info').innerHTML = '<p style="color:red;">Ошибка загрузки данных. Проверь файл hsk-data.json</p>';
            });

        function displayCharacterList() {
            const list = document.getElementById('char-list');
            characters.forEach((char, index) => {
                const btn = document.createElement('button');
                btn.className = 'char-btn';
                btn.textContent = char.character;
                btn.onclick = () => loadCharacter(index);
                list.appendChild(btn);
            });
        }

        function loadCharacter(index) {
            currentIndex = index;
            const char = characters[index];
            
            document.getElementById('character-target').innerHTML = '';
            document.getElementById('char').textContent = char.character;
            document.getElementById('pinyin').textContent = char.pinyin;
            document.getElementById('meaning').textContent = char.meaning;
            
            writer = HanziWriter.create('character-target', char.character, {
                width: 300,
                height: 300,
                padding: 20,
                showOutline: true,
                showCharacter: false
            });
        }

        function nextCharacter() {
            currentIndex = (currentIndex + 1) % characters.length;
            loadCharacter(currentIndex);
        }

        function animateCharacter() {
            if (writer) writer.animateCharacter();
        }

        function quizCharacter() {
            if (writer) {
                writer.quiz({
                    showOutline: true,
                    onCorrectStroke: function(strokeData) {
                        console.log('Правильная черта!');
                    },
                    onMistake: function(strokeData) {
                        console.log('Ошибка!');
                    },
                    onComplete: function(summaryData) {
                        alert('Отлично! Иероглиф написан правильно! ');
                    }
                });
            }
        }
    </script>
</body>
</html>
