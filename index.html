<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Учим иероглифы HSK 1-3</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="data.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
            background: #f5f5f5;
            margin: 0;
            touch-action: manipulation;
        }
        h1 { color: #d32f2f; font-size: 22px; margin: 10px 0; }
        
        #stats {
            background: white;
            border-radius: 10px;
            padding: 10px;
            margin: 10px auto;
            max-width: 400px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 18px; font-weight: bold; color: #d32f2f; }
        .stat-label { font-size: 11px; color: #666; }
        
        #progress-bar-container {
            max-width: 400px;
            margin: 10px auto;
            background: #ddd;
            border-radius: 10px;
            height: 15px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #d32f2f, #ff5252);
            width: 0%;
            transition: width 0.3s;
        }
        #progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        #level-tabs {
            max-width: 400px;
            margin: 15px auto;
            display: flex;
            gap: 5px;
        }
        .level-tab {
            flex: 1;
            padding: 10px;
            background: white;
            border: 2px solid #d32f2f;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .level-tab.active {
            background: #d32f2f;
            color: white;
        }
        
        #search-container {
            max-width: 400px;
            margin: 10px auto;
        }
        #search-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        #character-target {
            margin: 15px auto;
            width: 280px;
            height: 280px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #mnemonic {
            background: #fff9c4;
            border-left: 4px solid #fbc02d;
            padding: 10px;
            margin: 10px auto;
            max-width: 400px;
            border-radius: 5px;
            text-align: left;
        }
        #mnemonic-icon { font-size: 28px; text-align: center; }
        #mnemonic-text { font-size: 13px; color: #333; margin-top: 5px; }
        
        #info { margin: 10px 0; font-size: 15px; }
        #info span { color: #d32f2f; font-weight: bold; }
        
        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 14px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active { background: #b71c1c; }
        
        #quiz-hint {
            margin: 10px 0;
            font-size: 13px;
            font-style: italic;
            min-height: 20px;
        }
        
        #char-list {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .char-btn {
            padding: 8px;
            font-size: 16px;
            min-width: 38px;
            background: #fff;
            color: #333;
            border: 2px solid #d32f2f;
            border-radius: 5px;
        }
        .char-btn.active { background: #d32f2f; color: white; }
        .char-btn.learned { background: #c8e6c9; border-color: #4caf50; }
        
        #pagination {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        #page-info { font-size: 14px; color: #666; }
        
        #bonus-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffd54f;
            color: #333;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
        }
        
        #loading {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1> Учим иероглифы HSK</h1>
    
    <div id="stats">
        <div class="stat-item">
            <div class="stat-value" id="score">0</div>
            <div class="stat-label">⭐ Очки</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="streak">0</div>
            <div class="stat-label"> Серия</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="days">0</div>
            <div class="stat-label">📅 Дней</div>
        </div>
    </div>
    
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
    <div id="progress-text">Пройдено: <span id="learned-count">0</span> из <span id="total-count">0</span></div>
    
    <div id="level-tabs">
        <div class="level-tab active" onclick="switchLevel(1)">HSK 1</div>
        <div class="level-tab" onclick="switchLevel(2)">HSK 2</div>
        <div class="level-tab" onclick="switchLevel(3)">HSK 3</div>
    </div>
    
    <div id="search-container">
        <input type="text" id="search-input" placeholder=" Поиск по иероглифу, пиньиню или переводу..." oninput="handleSearch()">
    </div>
    
    <div id="character-target"></div>
    <div id="quiz-hint">Нажми "✏️ Проверить" чтобы начать рисование</div>
    
    <div id="info">
        <p><b>Иероглиф:</b> <span id="char">-</span></p>
        <p><b>Пиньинь:</b> <span id="pinyin">-</span></p>
        <p><b>Перевод:</b> <span id="meaning">-</span></p>
    </div>
    
    <div id="mnemonic">
        <div id="mnemonic-icon"></div>
        <div id="mnemonic-text">Загрузка...</div>
    </div>
    
    <div id="controls">
        <button onclick="animateCharacter()">▶ Анимация</button>
        <button onclick="quizCharacter()">✏️ Проверить</button>
        <button onclick="nextCharacter()">➡️ Следующий</button>
    </div>
    
    <div id="char-list"></div>
    
    <div id="pagination">
        <button onclick="prevPage()"> Назад</button>
        <span id="page-info">Страница 1</span>
        <button onclick="nextPage()">Вперед ▶</button>
    </div>
    
    <div id="bonus-popup"></div>

    <script>
        // Переменные состояния
        let writer;
        let currentIndex = 0;
        let currentLevel = 1;
        let filteredCharacters = [];
        let currentPage = 0;
        const ITEMS_PER_PAGE = 30;
        let currentStreak = 0;
        let searchQuery = '';

        let gameState = {
            score: 0,
            daysStreak: 0,
            lastStudyDate: null,
            learned: {}
        };

        // Загрузка сохраненного прогресса
        function loadGameState() {
            const saved = localStorage.getItem('hanziGameState');
            if (saved) {
                gameState = JSON.parse(saved);
            }
            const today = new Date().toDateString();
            if (gameState.lastStudyDate) {
                const lastDate = new Date(gameState.lastStudyDate);
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (gameState.lastStudyDate !== today) {
                    if (lastDate.toDateString() !== yesterday.toDateString()) {
                        gameState.daysStreak = 0;
                    }
                }
            }
            updateStats();
        }

        function saveGameState() {
            localStorage.setItem('hanziGameState', JSON.stringify(gameState));
        }

        function updateStats() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('streak').textContent = currentStreak;
            document.getElementById('days').textContent = gameState.daysStreak;
            const learnedCount = Object.keys(gameState.learned).length;
            const totalCount = allData.hsk1.length + allData.hsk2.length + allData.hsk3.length;
            document.getElementById('learned-count').textContent = learnedCount;
            document.getElementById('total-count').textContent = totalCount;
            const progress = totalCount > 0 ? (learnedCount / totalCount) * 100 : 0;
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        function showBonusPopup(text) {
            const popup = document.getElementById('bonus-popup');
            popup.textContent = text;
            popup.style.display = 'block';
            setTimeout(() => { popup.style.display = 'none'; }, 1500);
        }

        function switchLevel(level) {
            currentLevel = level;
            currentPage = 0;
            searchQuery = '';
            document.getElementById('search-input').value = '';
            
            document.querySelectorAll('.level-tab').forEach((tab, index) => {
                tab.classList.toggle('active', index + 1 === level);
            });
            
            applyFilters();
            if (filteredCharacters.length > 0) {
                loadCharacter(0);
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase();
            currentPage = 0;
            applyFilters();
            if (filteredCharacters.length > 0) {
                loadCharacter(0);
            }
        }

        function applyFilters() {
            const levelKey = 'hsk' + currentLevel;
            const levelChars = allData[levelKey] || [];
            
            if (!searchQuery) {
                filteredCharacters = levelChars;
            } else {
                filteredCharacters = levelChars.filter(char => 
                    char.character.includes(searchQuery) ||
                    char.pinyin.toLowerCase().includes(searchQuery) ||
                    char.meaning.toLowerCase().includes(searchQuery)
                );
            }
            displayCharacterList();
            updatePagination();
        }

        function displayCharacterList() {
            const list = document.getElementById('char-list');
            list.innerHTML = '';
            
            const start = currentPage * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageChars = filteredCharacters.slice(start, end);
            
            pageChars.forEach((char, index) => {
                const globalIndex = start + index;
                const btn = document.createElement('button');
                let className = 'char-btn';
                if (globalIndex === currentIndex) className += ' active';
                if (gameState.learned[char.character]) className += ' learned';
                btn.className = className;
                btn.textContent = char.character;
                btn.onclick = () => loadCharacter(globalIndex);
                list.appendChild(btn);
            });
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredCharacters.length / ITEMS_PER_PAGE);
            document.getElementById('page-info').textContent = `Страница ${currentPage + 1} из ${totalPages || 1}`;
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                displayCharacterList();
                updatePagination();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredCharacters.length / ITEMS_PER_PAGE);
            if (currentPage < totalPages - 1) {
                currentPage++;
                displayCharacterList();
                updatePagination();
            }
        }

        function loadCharacter(index) {
            if (index >= filteredCharacters.length) return;
            currentIndex = index;
            const char = filteredCharacters[index];
            
            document.getElementById('character-target').innerHTML = '';
            document.getElementById('char').textContent = char.character;
            document.getElementById('pinyin').textContent = char.pinyin;
            document.getElementById('meaning').textContent = char.meaning;
            document.getElementById('quiz-hint').textContent = 'Нажми "✏️ Проверить" чтобы начать рисование';
            document.getElementById('quiz-hint').style.color = '#666';
            
            document.getElementById('mnemonic-icon').textContent = char.icon || '';
            document.getElementById('mnemonic-text').textContent = char.mnemonic || 'Мнемоника не добавлена';
            
            displayCharacterList();
            
            writer = HanziWriter.create('character-target', char.character, {
                width: 280,
                height: 280,
                padding: 20,
                showOutline: true,
                showCharacter: false,
                strokeAnimationSpeed: 1,
                delayBetweenStrokes: 200
            });
        }

        function nextCharacter() {
            if (currentIndex < filteredCharacters.length - 1) {
                loadCharacter(currentIndex + 1);
            } else {
                alert('Это последний иероглиф в списке!');
            }
        }

        function animateCharacter() {
            if (writer) {
                document.getElementById('quiz-hint').textContent = 'Смотри анимацию...';
                document.getElementById('quiz-hint').style.color = '#666';
                writer.animateCharacter();
            }
        }

        function quizCharacter() {
            if (writer) {
                document.getElementById('quiz-hint').textContent = '✏️ Рисуй пальцем в квадрате!';
                document.getElementById('quiz-hint').style.color = '#1976d2';
                
                writer.quiz({
                    showOutline: true,
                    showHintAfterMisses: 2,
                    highlightOnComplete: true,
                    onCorrectStroke: function() {
                        document.getElementById('quiz-hint').textContent = '✓ Правильная черта!';
                        document.getElementById('quiz-hint').style.color = '#4caf50';
                    },
                    onMistake: function() {
                        document.getElementById('quiz-hint').textContent = '✗ Попробуй еще раз!';
                        document.getElementById('quiz-hint').style.color = '#f44336';
                    },
                    onComplete: function() {
                        document.getElementById('quiz-hint').textContent = ' Отлично! Иероглиф написан правильно!';
                        document.getElementById('quiz-hint').style.color = '#4caf50';
                        
                        const char = filteredCharacters[currentIndex];
                        
                        gameState.score += 10;
                        currentStreak++;
                        
                        if (currentStreak > 0 && currentStreak % 3 === 0) {
                            gameState.score += 5;
                            showBonusPopup('🔥 БОНУС +5 за серию ' + currentStreak + '!');
                        }
                        
                        gameState.learned[char.character] = true;
                        
                        const today = new Date().toDateString();
                        if (gameState.lastStudyDate !== today) {
                            gameState.daysStreak++;
                            gameState.lastStudyDate = today;
                        }
                        
                        saveGameState();
                        updateStats();
                        displayCharacterList();
                        
                        setTimeout(() => {
                            if (currentIndex < filteredCharacters.length - 1) {
                                loadCharacter(currentIndex + 1);
                            }
                        }, 2000);
                    }
                });
            }
        }

        // Запуск при загрузке страницы
        loadGameState();
        applyFilters();
        if (filteredCharacters.length > 0) {
            loadCharacter(0);
        }
    </script>
</body>
</html>
