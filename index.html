<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Учим иероглифы HSK 1-3</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
            background: #f5f5f5;
            margin: 0;
            touch-action: manipulation;
        }
        h1 { color: #d32f2f; font-size: 22px; margin: 10px 0; }
        
        /* Статистика */
        #stats {
            background: white;
            border-radius: 10px;
            padding: 10px;
            margin: 10px auto;
            max-width: 400px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 18px; font-weight: bold; color: #d32f2f; }
        .stat-label { font-size: 11px; color: #666; }
        
        /* Прогресс */
        #progress-bar-container {
            max-width: 400px;
            margin: 10px auto;
            background: #ddd;
            border-radius: 10px;
            height: 15px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #d32f2f, #ff5252);
            width: 0%;
            transition: width 0.3s;
        }
        #progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        /* Вкладки уровней */
        #level-tabs {
            max-width: 400px;
            margin: 15px auto;
            display: flex;
            gap: 5px;
        }
        .level-tab {
            flex: 1;
            padding: 10px;
            background: white;
            border: 2px solid #d32f2f;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .level-tab.active {
            background: #d32f2f;
            color: white;
        }
        
        /* Поиск */
        #search-container {
            max-width: 400px;
            margin: 10px auto;
        }
        #search-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        /* Поле рисования */
        #character-target {
            margin: 15px auto;
            width: 280px;
            height: 280px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Мнемоника */
        #mnemonic {
            background: #fff9c4;
            border-left: 4px solid #fbc02d;
            padding: 10px;
            margin: 10px auto;
            max-width: 400px;
            border-radius: 5px;
            text-align: left;
        }
        #mnemonic-icon { font-size: 28px; text-align: center; }
        #mnemonic-text { font-size: 13px; color: #333; margin-top: 5px; }
        
        /* Информация */
        #info { margin: 10px 0; font-size: 15px; }
        #info span { color: #d32f2f; font-weight: bold; }
        
        /* Кнопки */
        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 14px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active { background: #b71c1c; }
        
        /* Подсказка */
        #quiz-hint {
            margin: 10px 0;
            font-size: 13px;
            font-style: italic;
            min-height: 20px;
        }
        
        /* Список иероглифов с пагинацией */
        #char-list {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .char-btn {
            padding: 8px;
            font-size: 16px;
            min-width: 38px;
            background: #fff;
            color: #333;
            border: 2px solid #d32f2f;
            border-radius: 5px;
        }
        .char-btn.active { background: #d32f2f; color: white; }
        .char-btn.learned { background: #c8e6c9; border-color: #4caf50; }
        
        /* Пагинация */
        #pagination {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        #page-info { font-size: 14px; color: #666; }
        
        /* Бонус */
        #bonus-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffd54f;
            color: #333;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <h1> Учим иероглифы HSK</h1>
    
    <!-- Статистика -->
    <div id="stats">
        <div class="stat-item">
            <div class="stat-value" id="score">0</div>
            <div class="stat-label">⭐ Очки</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="streak">0</div>
            <div class="stat-label">🔥 Серия</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="days">0</div>
            <div class="stat-label">📅 Дней</div>
        </div>
    </div>
    
    <!-- Прогресс -->
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
    <div id="progress-text">Пройдено: <span id="learned-count">0</span> из <span id="total-count">0</span></div>
    
    <!-- Вкладки уровней -->
    <div id="level-tabs">
        <div class="level-tab active" onclick="switchLevel(1)">HSK 1</div>
        <div class="level-tab" onclick="switchLevel(2)">HSK 2</div>
        <div class="level-tab" onclick="switchLevel(3)">HSK 3</div>
    </div>
    
    <!-- Поиск -->
    <div id="search-container">
        <input type="text" id="search-input" placeholder="🔍 Поиск по иероглифу, пиньиню или переводу..." oninput="handleSearch()">
    </div>
    
    <!-- Поле рисования -->
    <div id="character-target"></div>
    <div id="quiz-hint">Нажми "✏️ Проверить" чтобы начать рисование</div>
    
    <!-- Информация -->
    <div id="info">
        <p><b>Иероглиф:</b> <span id="char">-</span></p>
        <p><b>Пиньинь:</b> <span id="pinyin">-</span></p>
        <p><b>Перевод:</b> <span id="meaning">-</span></p>
    </div>
    
    <!-- Мнемоника -->
    <div id="mnemonic">
        <div id="mnemonic-icon"></div>
        <div id="mnemonic-text">Загрузка...</div>
    </div>
    
    <!-- Кнопки -->
    <button onclick="animateCharacter()">▶ Анимация</button>
    <button onclick="quizCharacter()">✏️ Проверить</button>
    <button onclick="nextCharacter()">➡️ Следующий</button>
    
    <!-- Список иероглифов -->
    <div id="char-list"></div>
    
    <!-- Пагинация -->
    <div id="pagination">
        <button onclick="prevPage()"> Назад</button>
        <span id="page-info">Страница 1</span>
        <button onclick="nextPage()">Вперед ▶</button>
    </div>
    
    <!-- Бонус -->
    <div id="bonus-popup"></div>

    <script>

            { "character": "国", "pinyin": "guó", "meaning": "страна", "icon": "🏯", "mnemonic
